name: Apply v1.3.3 release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: "439299240"
      ZIP_ASSET_ID: "727973318"
      EXPECTED_SHA: "77a8f3240664149b704cabfeb20f77a00f051435932d7f3e78fd1f7748b216ec"
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Replace the zipped upload with the signed APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          cd /tmp/rel
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${ZIP_ASSET_ID}" > uploaded.zip
          unzip -o -q uploaded.zip -d extracted
          apk="$(find extracted -type f -iname '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error::The uploaded zip contains no APK."
            find extracted -maxdepth 3 -type f | head -n 20
            exit 1
          fi
          got="$(sha256sum "$apk" | cut -d' ' -f1)"
          echo "APK: $apk"
          echo "sha256: $got"
          if [ "$got" != "$EXPECTED_SHA" ]; then
            echo "::error::That APK is not the published v1.3.3 build (sha256 $got)."
            exit 1
          fi
          cp "$apk" NIMELSSA-Vault-v1.3.3.apk
          printf '%s  ./NIMELSSA-Vault-v1.3.3.apk\n' "$got" > SHA256SUMS.txt
          gh release upload "$RELEASE_ID" NIMELSSA-Vault-v1.3.3.apk SHA256SUMS.txt --clobber
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ZIP_ASSET_ID}"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f draft=false -f tag_name=v1.3.3 -f make_latest=true
          gh release view v1.3.3 --json tagName,isDraft,isLatest,assets

      - name: Update the site for v1.3.3
        run: |
          set -euo pipefail
          python3 tools/apply-1.3.3.py
          git config user.name "isygold1"
          git config user.email "israelagboola53@gmail.com"
          git rm -q .github/workflows/apply-1.3.3.yml tools/apply-1.3.3.py
          git add -A
          git commit -m "Update the site for NIMELSSA Vault v1.3.3"
          git push
