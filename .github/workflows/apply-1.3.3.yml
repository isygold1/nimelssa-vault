name: Apply v1.3.3 release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: "439299240"
      ZIP_ASSET_ID: "727973318"
      APK_NAME: NIMELSSA-Vault-v1.3.3.apk
      EXPECTED_SHA: "77a8f3240664149b704cabfeb20f77a00f051435932d7f3e78fd1f7748b216ec"
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Make sure the release carries the signed APK
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          mkdir -p /tmp/rel
          cd /tmp/rel

          apk_id="$(gh api "repos/${repo}/releases/${RELEASE_ID}" \
            --jq ".assets[] | select(.name == \"${APK_NAME}\") | .id" | head -n 1)"

          if [ -n "$apk_id" ]; then
            echo "Using ${APK_NAME} already attached to the release."
            gh api -H "Accept: application/octet-stream" \
              "repos/${repo}/releases/assets/${apk_id}" > "${APK_NAME}"
          elif gh api "repos/${repo}/releases/assets/${ZIP_ASSET_ID}" > /dev/null 2>&1; then
            echo "Falling back to the uploaded zip."
            gh api -H "Accept: application/octet-stream" \
              "repos/${repo}/releases/assets/${ZIP_ASSET_ID}" > uploaded.zip
            unzip -o -q uploaded.zip -d extracted
            found="$(find extracted -type f -iname '*.apk' | head -n 1)"
            if [ -z "$found" ]; then
              echo "::error::The uploaded zip contains no APK."
              exit 1
            fi
            cp "$found" "${APK_NAME}"
          else
            echo "::error::No ${APK_NAME} asset and no zip asset on the release."
            exit 1
          fi

          got="$(sha256sum "${APK_NAME}" | cut -d' ' -f1)"
          echo "sha256: $got"
          if [ "$got" != "$EXPECTED_SHA" ]; then
            echo "::error::That APK is not the published v1.3.3 build (sha256 $got)."
            exit 1
          fi

          printf '%s  ./%s\n' "$got" "${APK_NAME}" > SHA256SUMS.txt
          gh release upload "$RELEASE_ID" SHA256SUMS.txt --clobber --repo "$repo"
          gh api -X DELETE "repos/${repo}/releases/assets/${ZIP_ASSET_ID}" || true
          gh api -X PATCH "repos/${repo}/releases/${RELEASE_ID}" \
            -f draft=false -f tag_name=v1.3.3 -f make_latest=true > /dev/null
          gh release view v1.3.3 --repo "$repo" \
            --json tagName,isDraft,isLatest,assets \
            --jq '"tag=\(.tagName) draft=\(.isDraft) latest=\(.isLatest) assets=\([.assets[].name] | join(","))"'

          url="https://github.com/${repo}/releases/download/v1.3.3/${APK_NAME}"
          ok=0
          for attempt in 1 2 3 4 5; do
            if curl -fsIL "$url" > /dev/null; then ok=1; break; fi
            echo "download URL not ready yet (attempt ${attempt}); retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::The published download URL is not serving ${APK_NAME}."
            exit 1
          fi
          echo "download URL is live: $url"

      - name: Update the site for v1.3.3
        run: |
          set -euo pipefail
          python3 tools/apply-1.3.3.py
          git config user.name "isygold1"
          git config user.email "israelagboola53@gmail.com"
          git rm -q .github/workflows/apply-1.3.3.yml tools/apply-1.3.3.py
          git add -A
          git commit -m "Update the site for NIMELSSA Vault v1.3.3"
          git push
